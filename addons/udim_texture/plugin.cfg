[plugin]

name="UDIM Textures"
description="UDIM-текстуры для Godot 4.7: набор тайлов одной карты (UDIMTextureSet) и материал UDIMMaterial, который по номеру UDIM собирает сгенерированный шейдер. Карты: albedo, roughness, metallic, normal, emission, AO и Height (параллакс). Тайлы находятся в папке по именам вида name.1001.png."
author="pkmollman (original idea), rework for Godot 4.7"
version="1.2.1"
script="udim_plugin.gd"
